[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-geolocation"
description = "Geolocate recordings via Doppler-shifted aircraft sound matched against historical ADS-B flight tracks"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "pandas>=2.2",  # numpy 2.x ABI compatibility
    "pyproj",
    "soundfile",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
acoustic-geolocate = "acoustic_geolocation.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
